server {
    listen ${PORT} default_server;
    listen [::]:${PORT} default_server;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # Re-resolve the backend hostname per request instead of caching the
        # IP at startup; Railway assigns services a new private IP on every
        # deploy. Using a variable in proxy_pass forces runtime resolution.
        resolver ${NGINX_RESOLVER} valid=5s;
        set $backend_url ${BACKEND_URL};
        proxy_pass $backend_url;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
